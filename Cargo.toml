[package]
name = "yoneda"
version = "0.1.0"
edition = "2024"
description = "Yoneda lemma and representable functors for agent systems"
license = "MIT"
repository = "https://github.com/SuperInstance/yoneda"
keywords = ["category-theory", "yoneda", "functor", "agent", "presheaf"]
categories = ["mathematics", "data-structures"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
